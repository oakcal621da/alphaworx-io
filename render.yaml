# Paid web service required for outbound SMTP (port 587, Google Workspace).
# Separate contact service and review preview; its Render origin is allowed
# automatically. The existing static site and domain stay in place.
services:
  - type: web
    name: alphaworx-contact
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: SMTP_USERNAME
        value: support@alphaworx.io
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: CONTACT_SIGNING_KEY
        generateValue: true
      - key: PUBLIC_ORIGIN
        value: https://alphaworx.io
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
